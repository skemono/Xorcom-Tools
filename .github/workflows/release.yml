name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Wails CLI (pinned)
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28
      - name: Test
        run: go test ./pbx/...
      - name: Build
        run: wails3 task build VERSION=${{ github.ref_name }}
      - name: Package (names must match go-selfupdate rules)
        run: |
          7z a UtilidadesXorcom_windows_amd64.zip ./bin/UtilidadesXorcom.exe
          printf '%s  %s\n' "$(sha256sum UtilidadesXorcom_windows_amd64.zip | cut -d' ' -f1)" UtilidadesXorcom_windows_amd64.zip > checksums.txt
          cat checksums.txt
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" UtilidadesXorcom_windows_amd64.zip checksums.txt --generate-notes
